name: Build and publish TUI

run-name: TUI standalone ${{ inputs.tag_name || github.sha }}

on:
  workflow_dispatch:
    inputs:
      publish_type:
        description: Release type
        required: true
        default: prerelease
        type: choice
        options: [release, prerelease, none]
      tag_name:
        description: Tag to create when publishing (for example, v0.1.0)
        required: false
        type: string
      core_commit:
        description: Full rustyera-core commit SHA (leave empty for the default branch HEAD)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-tui-${{ inputs.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  resolve-core:
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.core.outputs.revision }}
    steps:
      - name: Resolve core revision
        id: core
        env:
          CORE_COMMIT: ${{ inputs.core_commit }}
        run: |
          revision="$CORE_COMMIT"
          if [[ -z "$revision" ]]; then
            revision="$(git ls-remote https://github.com/PrunusSerrulata/rustyera-core.git HEAD | awk '$2 == "HEAD" { print $1; exit }')"
          fi
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "core_commit must be a full 40-character lowercase commit SHA" >&2
            exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

  package:
    name: Standalone (${{ matrix.name }})
    needs: resolve-core
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x86_64, runner: windows-latest, library: era_runtime_capi.dll }
          - { name: linux-x86_64, runner: ubuntu-latest, library: libera_runtime_capi.so }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm, library: libera_runtime_capi.so }
          - { name: macos-x86_64, runner: macos-15-intel, library: libera_runtime_capi.dylib }
          - { name: macos-arm64, runner: macos-latest, library: libera_runtime_capi.dylib }
    steps:
      - uses: actions/checkout@v7
      - name: Record selected core revision
        shell: pwsh
        run: |
          Set-Content -NoNewline rustyera-core.rev '${{ needs.resolve-core.outputs.revision }}'
      - uses: actions/checkout@v7
        with:
          repository: PrunusSerrulata/rustyera-core
          ref: ${{ needs.resolve-core.outputs.revision }}
          path: _deps/rustyera-core
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Build pinned runtime library
        run: cargo build --manifest-path _deps/rustyera-core/Cargo.toml --package era-runtime-capi --release --locked
      - name: Install runtime library in Python package
        shell: pwsh
        run: Copy-Item -Force "target/release/${{ matrix.library }}" "src/rustyera_tui/${{ matrix.library }}"
      - name: Build standalone TUI
        shell: pwsh
        run: |
          uv sync --locked
          uv run pytest
          uv run pyinstaller --clean --noconfirm rustyera_tui.spec
          Compress-Archive -Path dist/rustyera_tui -DestinationPath "rustyera-tui-${{ matrix.name }}-standalone.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: rustyera-tui-${{ matrix.name }}-standalone
          path: rustyera-tui-${{ matrix.name }}-standalone.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    if: inputs.publish_type != 'none'
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Require tag
        if: inputs.tag_name == ''
        run: exit 1
      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag_name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.publish_type == 'prerelease' }}
          generate_release_notes: true
          body: |
            ## 使用说明

            1. 按操作系统和 CPU 架构下载对应的 `standalone.zip`，并完整解压。
            2. 运行解压目录中的 `rustyera_tui`（Windows 为 `rustyera_tui.exe`），将包含 `CSV/` 和 `ERB/` 的 Era 游戏目录作为参数传入。例如：

               ```text
               rustyera_tui /path/to/game
               ```

            Linux 或 macOS 首次运行前如有需要，请执行 `chmod +x rustyera_tui`。如果 macOS 提示应用来自身份不明的开发者，请确认文件下载自本发布页，然后在终端进入解压目录并执行 `xattr -dr com.apple.quarantine rustyera_tui` 解除隔离。压缩包已包含 runtime 动态库和 Python 依赖，无需另行安装。
          files: packages/*.zip
