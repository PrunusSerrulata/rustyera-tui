name: Publish TUI prerelease

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Prerelease tag to create or update (for example, v0.1.0-rc.1)
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            runner: windows-latest
            library: era_runtime_capi.dll
            cargo_target: ""
            library_path: target/release/era_runtime_capi.dll
          - name: linux-x86_64
            runner: ubuntu-latest
            library: libera_runtime_capi.so
            cargo_target: ""
            library_path: target/release/libera_runtime_capi.so
          - name: linux-aarch64
            runner: ubuntu-latest
            library: libera_runtime_capi.so
            cargo_target: --target aarch64-unknown-linux-gnu
            library_path: target/aarch64-unknown-linux-gnu/release/libera_runtime_capi.so
            install_aarch64_gcc: true

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux aarch64 linker
        if: matrix.install_aarch64_gcc
        run: sudo apt-get update && sudo apt-get install --yes gcc-aarch64-linux-gnu

      - name: Install Linux aarch64 Rust target
        if: matrix.install_aarch64_gcc
        run: rustup target add aarch64-unknown-linux-gnu

      - name: Build the release C API library
        run: cargo build --package era-runtime-capi --release ${{ matrix.cargo_target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Assemble distribution directory
        shell: pwsh
        run: |
          $package = "rustyera-tui-${{ matrix.name }}"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item -Recurse -Force frontends/era-tui/* $package
          Copy-Item -Force "${{ matrix.library_path }}" $package
          Compress-Archive -Path $package -DestinationPath "$package.zip"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: rustyera-tui-${{ matrix.name }}
          path: rustyera-tui-${{ matrix.name }}.zip
          if-no-files-found: error

  package_macos:
    name: Package (macOS x86_64 and arm64)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Build the release C API libraries
        run: |
          cargo build --package era-runtime-capi --release
          cargo build --package era-runtime-capi --release --target x86_64-apple-darwin

      - name: Assemble distribution directories
        shell: pwsh
        run: |
          $packages = @(
            @{ Name = "rustyera-tui-macos-x86_64"; Library = "target/x86_64-apple-darwin/release/libera_runtime_capi.dylib" },
            @{ Name = "rustyera-tui-macos-arm64"; Library = "target/release/libera_runtime_capi.dylib" }
          )
          foreach ($item in $packages) {
            New-Item -ItemType Directory -Force -Path $item.Name | Out-Null
            Copy-Item -Recurse -Force frontends/era-tui/* $item.Name
            Copy-Item -Force $item.Library $item.Name
            Compress-Archive -Path $item.Name -DestinationPath "$($item.Name).zip"
          }

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: rustyera-tui-macos
          path: |
            rustyera-tui-macos-x86_64.zip
            rustyera-tui-macos-arm64.zip
          if-no-files-found: error

  publish:
    name: Publish prerelease
    needs: [package, package_macos]
    runs-on: ubuntu-latest

    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true

      - name: Create or update prerelease
        uses: softprops/action-gh-release@v6
        with:
          tag_name: ${{ inputs.tag_name }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          body: |
            ## 使用方法

            1. 下载与操作系统和 CPU 架构相符的 ZIP：`windows-x86_64`、`linux-x86_64`、`linux-aarch64`、`macos-x86_64` 或 `macos-arm64`。
            2. 解压 ZIP。压缩包包含 Textual TUI 源码、`pyproject.toml`/`uv.lock` 和对应平台的 `era-runtime-capi` 动态库；不包含游戏资源。
            3. 安装 Python 3.12 或更高版本及 [uv](https://docs.astral.sh/uv/)，然后在解压目录运行 `uv sync` 安装依赖。
            4. 将游戏的 `CSV/` 和 `ERB/` 等资源目录放入解压目录后，可在该目录运行 `uv run rustyera-tui`。

            如游戏资源和/或runtime动态库位于其他目录，请在解压目录运行以下命令，并作如下替换：
            * `GAME_DIRECTORY` 替换为包含 `CSV/` 和 `ERB/` 的路径
            * `LIBRARY_FILE` 替换为当前压缩包内的动态库文件名：
              * Windows 为 `era_runtime_capi.dll`
              * Linux 为 `libera_runtime_capi.so`
              * macOS 为 `libera_runtime_capi.dylib`

            ```sh
            uv run rustyera-tui GAME_DIRECTORY --runtime-library ./LIBRARY_FILE
            ```

          files: packages/*.zip
