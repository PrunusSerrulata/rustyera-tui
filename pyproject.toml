[project]
name = "rustyera-tui"
version = "0.1.0"
description = "RustyEra runtime C ABI 的可移植 Textual 前端"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
dependencies = [
    "blake3>=1.0.5",
    "cbor2>=5.6.5",
    "pyinstaller>=6.21.0",
    "textual>=6.0.0",
    "zstandard>=0.23.0",
]

[project.scripts]
rustyera-tui = "rustyera_tui.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
